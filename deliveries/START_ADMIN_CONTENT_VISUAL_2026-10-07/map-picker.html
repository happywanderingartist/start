<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索地图地点 · START</title><link rel="stylesheet" href="map-picker.css"></head><body><form id="search-form"><label>城市<input id="city" maxlength="40" autocomplete="address-level2" required placeholder="例如：济南"></label><label class="keyword-label">地点名称<input id="keyword" type="search" maxlength="80" required placeholder="搜索景点、餐厅或场馆"></label><button type="submit" class="primary">搜索</button></form><p id="search-status" role="status">输入城市和地点名称，在高德地图中查找。</p><div class="picker-grid"><section class="map-area" aria-label="地图"><div id="map"></div><div class="map-note"><span id="map-status" role="status">正在加载高德地图…</span><button id="retry-map" hidden>重试</button></div></section><section class="result-area" aria-label="搜索结果"><div id="results"><p class="empty">搜索后，选择地图标记或下方地点。</p></div></section></div><footer><div id="selected"><strong>尚未选择地点</strong><small>高德地点信息不会自动产生艺人到访标签。</small></div><button id="choose" class="primary" disabled>加入路线</button></footer><script src="map-picker.js"></script></body></html>
