<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>START 文字识别地点 · 视觉确认稿</title><style>body{margin:0;background:#FBF3E8}svg{display:block;width:100%;height:auto}*{box-sizing:border-box}</style><body><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120"><title>START 从文字提取地点视觉确认稿</title><desc>左侧粘贴原文，右侧核对地点名称、原文片段及地图匹配。所有结果为示例，不代表真实识别。</desc><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1400" height="1120" rx="0" fill="#FBF3E8" stroke="none"/><text x="40" y="48" font-size="30" fill="#3F241C" font-weight="700">从文字提取地点</text><text x="1010" y="45" font-size="16" fill="#702720" font-weight="600">视觉确认稿 · 示例结果</text><text x="40" y="82" font-size="17" fill="#765C51" font-weight="400">粘贴原文，检查名称和地图地点，再加入草稿。</text><path d="M40,104L1360,104" stroke="#D7BEB0"/><text x="40" y="139" font-size="17" fill="#702720" font-weight="650">01  粘贴文字</text><text x="680" y="139" font-size="17" fill="#702720" font-weight="650">02  检查地点</text><rect x="40" y="159" width="610" height="746" rx="18" fill="#FBF3E8" stroke="#D7BEB0"/><rect x="680" y="159" width="680" height="746" rx="18" fill="#FBF3E8" stroke="#D7BEB0"/><text x="66" y="197" font-size="17" fill="#3F241C" font-weight="650">原文</text><text x="443" y="197" font-size="12" fill="#765C51" font-weight="400">小红书等平台 · 手动粘贴</text><rect x="66" y="216" width="558" height="251" rx="12" fill="#FBF3E8" stroke="#D7BEB0"/><text x="83" y="253" font-size="18" fill="#3F241C" font-weight="400">安溥济南 Citywalk</text><text x="83" y="285" font-size="18" fill="#3F241C" font-weight="400">先去趵突泉，旁边是李清照纪念堂；</text><text x="83" y="317" font-size="18" fill="#3F241C" font-weight="400">再到大明湖、曲水亭街、厚德泉，</text><text x="83" y="349" font-size="18" fill="#3F241C" font-weight="400">最后逛不贵书店。</text><text x="83" y="381" font-size="18" fill="#3F241C" font-weight="400">不贵书店别忘了拍照。</text><text x="83" y="449" font-size="13" fill="#765C51" font-weight="400">也支持无序的地点清单。</text><text x="66" y="501" font-size="14" fill="#3F241C" font-weight="600">默认城市</text><rect x="66" y="512" width="263" height="44" rx="9" fill="#FBF3E8" stroke="#D7BEB0"/><text x="79" y="540" font-size="16" fill="#3F241C" font-weight="400">济南</text><text x="361" y="501" font-size="14" fill="#3F241C" font-weight="600">艺人（单独选择）</text><rect x="361" y="512" width="263" height="44" rx="9" fill="#FBF3E8" stroke="#D7BEB0"/><text x="374" y="540" font-size="16" fill="#3F241C" font-weight="400">安溥</text><text x="66" y="595" font-size="14" fill="#3F241C" font-weight="600">来源链接（选填）</text><rect x="66" y="606" width="558" height="44" rx="9" fill="#FBF3E8" stroke="#D7BEB0"/><text x="79" y="634" font-size="16" fill="#3F241C" font-weight="400">粘贴原始笔记链接</text><text x="66" y="690" font-size="14" fill="#3F241C" font-weight="600">导入到</text><rect x="66" y="704" width="558" height="44" rx="9" fill="#EAE5DA" stroke="none"/><text x="79" y="732" font-size="16" fill="#3F241C" font-weight="400">当前路线：安溥济南 Citywalk</text><rect x="449" y="786" width="175" height="44" rx="10" fill="#CBE5FE" stroke="none"/><g><text x="465" y="814" font-size="15" fill="#3B7789" font-weight="600">识别地点</text></g><text x="66" y="819" font-size="13" fill="#765C51" font-weight="400">城市缺失或跨城市地点，会留待核对。</text><text x="66" y="858" font-size="13" fill="#765C51" font-weight="400">原文保留在草稿中，方便回看和修改。</text><text x="706" y="197" font-size="20" fill="#3F241C" font-weight="650">6 个候选名称</text><text x="706" y="227" font-size="13" fill="#765C51" font-weight="400">示例排版 · 尚未搜索高德，尚未加入路线</text><text x="1198" y="198" font-size="14" fill="#702720" font-weight="600">＋ 手动补充</text><path d="M706,248L1334,248" stroke="#D7BEB0"/><rect x="706" y="272" width="19" height="19" rx="4" fill="#FBF3E8" stroke="#D7BEB0"/><text x="741" y="288" font-size="12" fill="#765C51" font-weight="400">01</text><rect x="770" y="263" width="327" height="37" rx="7" fill="#FBF3E8" stroke="#D7BEB0"/><text x="782" y="287" font-size="17" fill="#3F241C" font-weight="600">趵突泉</text><text x="1315" y="288" font-size="22" fill="#765C51" font-weight="400">×</text><text x="770" y="319" font-size="12" fill="#765C51" font-weight="400">原文：先去趵突泉</text><text x="770" y="340" font-size="11" fill="#765C51" font-weight="400">高德匹配待查询</text><rect x="1142" y="262" width="132" height="44" rx="10" fill="#CBE5FE" stroke="none"/><g><text x="1158" y="290" font-size="15" fill="#3B7789" font-weight="600">查找地点</text></g><path d="M706,348L1334,348" stroke="#D7BEB0"/><rect x="706" y="360" width="19" height="19" rx="4" fill="#FBF3E8" stroke="#D7BEB0"/><text x="741" y="376" font-size="12" fill="#765C51" font-weight="400">02</text><rect x="770" y="351" width="327" height="37" rx="7" fill="#FBF3E8" stroke="#D7BEB0"/><text x="782" y="375" font-size="17" fill="#3F241C" font-weight="600">李清照纪念堂</text><text x="1315" y="376" font-size="22" fill="#765C51" font-weight="400">×</text><text x="770" y="407" font-size="12" fill="#765C51" font-weight="400">原文：旁边是李清照纪念堂</text><text x="770" y="428" font-size="11" fill="#765C51" font-weight="400">高德匹配待查询</text><rect x="1142" y="350" width="132" height="44" rx="10" fill="#CBE5FE" stroke="none"/><g><text x="1158" y="378" font-size="15" fill="#3B7789" font-weight="600">查找地点</text></g><path d="M706,436L1334,436" stroke="#D7BEB0"/><rect x="706" y="448" width="19" height="19" rx="4" fill="#FBF3E8" stroke="#D7BEB0"/><text x="741" y="464" font-size="12" fill="#765C51" font-weight="400">03</text><rect x="770" y="439" width="327" height="37" rx="7" fill="#FBF3E8" stroke="#D7BEB0"/><text x="782" y="463" font-size="17" fill="#3F241C" font-weight="600">大明湖</text><text x="1315" y="464" font-size="22" fill="#765C51" font-weight="400">×</text><text x="770" y="495" font-size="12" fill="#765C51" font-weight="400">原文：再到大明湖</text><text x="770" y="516" font-size="11" fill="#765C51" font-weight="400">高德匹配待查询</text><rect x="1142" y="438" width="132" height="44" rx="10" fill="#CBE5FE" stroke="non xt x="782" y="727" font-size="17" fill="#3F241C" font-weight="600">不贵书店</text><text x="1315" y="728" font-size="22" fill="#765C51" font-weight="400">×</text><text x="770" y="759" font-size="12" fill="#765C51" font-weight="400">原文：最后逛不贵书店</text><text x="770" y="780" font-size="11" fill="#765C51" font-weight="400">原文出现 2 次，建议合并</text><rect x="1142" y="702" width="132" height="44" rx="10" fill="#CBE5FE" stroke="none"/><g><text x="1158" y="730" font-size="15" fill="#3B7789" font-weight="600">查看原文</text></g><path d="M706,813L1334,813" stroke="#D7BEB0"/><text x="706" y="846" font-size="14" fill="#702720" font-weight="600">地图地点未确认</text><text x="706" y="872" font-size="12" fill="#765C51" font-weight="400">可删、可改、可补充；顺序仍可调整。</text><rect x="1129" y="829" width="205" height="44" rx="10" fill="#CBE5FE" stroke="none"/><g opacity="0.5"><text x="1145" y="857" font-size="15" fill="#3B7789" font-weight="600">检查后加入路线</text></g><path d="M40,938L1360,938" stroke="#D7BEB0"/><text x="40" y="970" font-size="16" fill="#3F241C" font-weight="650">同一入口的状态</text><text x="40" y="1004" font-size="14" fill="#702720" font-weight="600">识别中</text><text x="40" y="1031" font-size="14" fill="#765C51" font-weight="400">正在提取地点 · 可取消</text><text x="370" y="1004" font-size="14" fill="#702720" font-weight="600">空结果</text><text x="370" y="1031" font-size="14" fill="#765C51" font-weight="400">未找到地点 · 手动补充</text><text x="700" y="1004" font-size="14" fill="#702720" font-weight="600">失败</text><text x="700" y="1031" font-size="14" fill="#765C51" font-weight="400">保留原文 · 重试识别</text><text x="1030" y="1004" font-size="14" fill="#702720" font-weight="600">加入后</text><text x="1030" y="1031" font-size="14" fill="#765C51" font-weight="400">进入草稿 · 可撤销本批</text><text x="40" y="1080" font-size="14" fill="#765C51" font-weight="400">本稿仅展示结构与样例。智能识别、高德批量匹配及加入草稿的业务逻辑，待视觉确认后接入。</text></g></svg></body></html>
