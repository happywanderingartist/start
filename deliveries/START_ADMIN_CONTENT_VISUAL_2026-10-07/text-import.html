<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>START · 从文字识别地点</title><link rel="stylesheet" href="text-import.css"></head><body>
<header class="top"><div><span class="eyebrow">内容建设 / 导入草稿</span><h1>从文字识别地点</h1><p id="target">先核对，再加入地点草稿。</p></div><button id="close" class="round" aria-label="关闭文字识别">×</button></header>
<main class="workspace"><section class="source-pane" aria-labelledby="source-title"><div class="section-head"><h2 id="source-title">粘贴原文</h2><span id="model-status" class="badge">检查本机模型…</span></div><label for="source-text">地点清单或攻略文字</label><textarea id="source-text" placeholder="济南：趵突泉、大明湖、曲水亭街。&#10;上海：外滩、上海邮政博物馆。" aria-describedby="source-help"></textarea><div class="helper"><span id="source-help">原文只用于提取，不会直接公开。</span><span id="length">0 / 3500</span></div><div class="fields"><div><label for="default-city">默认城市 <small>选填</small></label><input id="default-city" maxlength="40" placeholder="原文未写城市时使用"></div><div><label for="artist">艺人 <small>一位</small></label><select id="artist"><option value="">暂不关联</option><option>安溥</option><option>苏打绿</option></select></div><div class="full"><label for="source-link">来源链接 <small>选填</small></label><input id="source-link" type="url" placeholder="https://…" maxlength="500"></div></div><div class="source-actions"><button id="recognize" class="primary">识别地点</button><button id="cancel" class="secondary" hidden>取消识别</button></div><p class="helper-note">本机模型可能漏识别，请检查名称和城市。艺人到访需另行核对。</p><p id="source-error" role="alert" class="error"></p></section>
<section class="review-pane" aria-labelledby="review-title"><div class="section-head"><div><h2 id="review-title">核对地点</h2><p id="count">0 个待核对</p></div><button id="manual" class="secondary">＋ 手动补充</button></div><div class="review-tools"><button id="match" class="secondary" disabled>查询高德候选</button><button id="cancel-match" class="secondary" hidden>停止查询</button><span id="match-status" role="status"></span></div><p id="status" class="status-message" role="status">识别后，逐条选择具体地图地点。</p><div id="candidates"><div class="empty"><span class="empty-icon" aria-hidden="true">⌖</span><h3>地点会出现在这里</h3><p>也可以手动添加，不必编成路线。</p></div></div></section></main>
<footer><div><strong id="selection-count">已选 0 个地点</strong><small>仅加入本页演示草稿，刷新后重置。</small></div><button id="commit" class="primary" disabled>加入地点草稿</button></footer>
<dialog id="picker"><header><h2>核对地图地点</h2><button id="close-picker" class="round" aria-label="关闭地图选点">×</button></header><iframe id="picker-frame" title="高德地图搜索选点"></iframe></dialog>
<script src="batch-domain.js"></script><script src="text-import.js"></script></body></html>
